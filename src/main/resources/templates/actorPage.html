<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${actor.fullname}">Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary" style="margin-bottom: 45px;" data-bs-theme="light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <img src="/images/cinema.png" width="45px" class="d-inline-block align-text-left"/>
            <span style="margin-left: 20px;">Кинопортал</span>
        </a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/movies">Фильмы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/actors">Актеры</a>
                </li>
            </ul>
        </div>
        <form th:action="@{/search}" method="get" class="d-flex" >
            <input th:text="${text}" class="form-control me-2" type="search" name="text" placeholder="Search movie..." aria-label="Search movie..."/>
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>

<div class="row d-flex justify-content-center">
    <div class="col-3">
        <img th:src="@{/images/actors/} + ${actor.actor_id} + '.jpg'" class="rounded" width="450px"/>
    </div>
    <div class="col-5">
        <h1 th:text="${actor.fullname}"></h1>
        <p th:text="'Дата рождения: '+ ${birthDate}"></p>
        <p th:text="${actor.description}"></p>

        <ul class="list-group">
            <h3>Участие в фильмах:</h3>
            <li th:each="item : ${roles}" class="list-group-item">
                <a th:href="@{/movies/{id}(id=${item.movie.movieId})}" th:text="${item.movie.title}"
                   class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover"></a>
                 /
                <span th:text="${item.roleName}"></span>
            </li>
        </ul>

    </div>
</div>


</body>
</html>
