<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{navbar::navigation}"> </div>

<div class="card text-center mx-auto" style="width: 18rem;">
  <div class="card-body">
    <h2 class="card-title mb-4">Вход</h2>

    <div th:if="${success}" th:text="${success}" class="alert alert-success"></div>

    <div th:if="${error}" th:text="${error}" class="alert alert-danger"></div>
    <form th:action="@{/login}" method="post">
      <input type="text" name="username" placeholder="Имя пользователя" required class="form-control"> <br>
      <input type="password" name="password" placeholder="Пароль" required class="form-control"> <br>
      <button type="submit" class="btn btn-primary mb-4 w-100">Войти</button>
      <p class="text-muted fst-italic">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться!</a></p>
    </form>
  </div>


</div>


</body>
</html>
