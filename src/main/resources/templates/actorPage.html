<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${actor.fullname}">Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body style="overflow-x: hidden;">
<div th:replace="navbar::navigation"> </div>

<div class="row d-flex justify-content-center mb-5">
    <div class="col-3">
        <img th:src="@{/images/actors/} + ${actor.actor_id} + '.jpg'" class="rounded" width="450px"/>
    </div>
    <div class="col-5">

        <div class="d-flex justify-content-between align-items-center">
            <h1 th:text="${actor.fullname}"></h1>

            <form th:action="@{/actors/{id}/toggle(id=${actor.actor_id})}" method="post" class="d-inline">
                <button type="submit" class="btn"
                        th:classappend="${isFavorite} ? 'btn-danger' : 'btn-outline-danger'">
                    <i class="bi bi-heart"></i>
                    <span th:text="${isFavorite} ? '❤️ В избранном' : '♡ В избранное'"></span>
                </button>
            </form>
        </div>




        <p th:text="'Дата рождения: '+ ${birthDate}"></p>
        <p th:utext="${description}"></p>

        <ul class="list-group">
            <h3>Участие в фильмах:</h3>
            <li th:each="item : ${roles}" class="list-group-item">
                <a th:href="@{/movies/{id}(id=${item.movie.movieId})}" th:text="${item.movie.title}"
                   class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover"></a>
                 /
                <span th:text="${item.roleName}"></span>
            </li>
        </ul>



    </div>
</div>


</body>
</html>
