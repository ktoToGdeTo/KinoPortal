<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body><div th:replace="~{navbar::navigation}"> </div>
<div class="container-fluid p-3 col-8">
    <ul th:if="${not #lists.isEmpty(foundMovies)}" class="list-group list-group-flush mb-5">
        <h1>Найденные фильмы:</h1>
        <li th:each="item : ${foundMovies}" class="list-group-item">
            <a th:href="@{/movies/{id}(id=${item.movie_id})}"  th:text="${item.title}" class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover"></a>
        </li>
    </ul>
    <ul th:if="${not #lists.isEmpty(foundActors)}" class="list-group list-group-flush">
        <h1>Найденные актеры:</h1>
        <li th:each="item : ${foundActors}" class="list-group-item">
            <a th:href="@{/actors/{id}(id=${item.actor_id})}"  th:text="${item.fullname}" class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover"></a>
        </li>
    </ul>
    <h2 th:if="${#lists.isEmpty(foundActors)} and ${#lists.isEmpty(foundMovies)}">По вашему запросу ничего не было найдено :(</h2>
</div>
</body>
</html>
