<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>

<div class="container-fluid p-3 position-absolute top-50 start-50 translate-middle">
  <div class="row d-flex justify-content-center">
    <div class="col-2 d-flex align-items-center justify-content-center">
      <img src="/images/notFound.png" width="250px">
    </div>
    <div class="col-5 d-flex align-items-center p-5 border border-secondary border-top-0 border-end-0 border-bottom-0">
      <div>
        <h1>
          404: Страница не найдена.
        </h1>
        <p class="lead">
          Вы попали на страницу, где ничего нет... Вернитесь назад или перейдите по другой ссылке.
        </p>
        <div class="d-flex flex-row-reverse">
            <a role="button" href="/" class="btn btn-outline-dark" style="width: 100%;">Вернуться на главную</a>
        </div>

      </div>

    </div>
  </div>
</div>


</body>
</html>
